spring:
  flyway:
    enabled: false
  task:
    scheduling:
      enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-components: never
      show-details: never
  health:
    rabbit:
      enabled: false

outbox:
  relay:
    enabled: false
